<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-UI Panel Installer - Interactive Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chosen Palette: Slate & Amber -->
    <!-- Application Structure Plan: A single-page, scrolling layout designed to function like a product landing page. The structure prioritizes immediate action and clarity. 1. Hero section with the primary installation command and a copy button. 2. A visual 'Features' section with interactive cards. 3. An interactive 'Terminal Simulator' to demonstrate commands. This structure is chosen to guide the user from "what is this?" to "how do I use it?" and finally to "let me see it work" in a fluid, engaging manner. A language toggle ensures bilingual accessibility. -->
    <!-- Visualization & Content Choices: The core content (installation command & features) is transformed from a linear README into interactive components. Main Command (Goal: Action): A styled code block with a one-click copy button (HTML/JS). Features (Goal: Organize/Inform): A grid of cards with icons and descriptions (HTML/Tailwind); clicking a card triggers the terminal (JS). Terminal Simulator (Goal: Demonstrate/Engage): A fake terminal UI that "types" commands and shows simulated output (JS). This provides a safe, visual way to understand the script's behavior. NO SVG/Mermaid used. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <style>
        body { font-family: 'Inter', 'Vazirmatn', sans-serif; scroll-behavior: smooth; }
        #app-container.rtl { direction: rtl; }
        .terminal-cursor {
            display: inline-block;
            background-color: #f59e0b; /* amber-500 */
            width: 10px;
            height: 1.2em;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            from, to { background-color: transparent; }
            50% { background-color: #f59e0b; }
        }
        .rtl .space-x-4 > :not([hidden]) ~ :not([hidden]) { margin-right: 1rem; margin-left:0; }
        .rtl .ml-auto { margin-right: auto; margin-left:0; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">

    <div id="app-container">
        <header class="bg-white/80 backdrop-blur-lg shadow-sm sticky top-0 z-50">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center space-x-4">
                        <span class="text-2xl">⚡️</span>
                        <h1 class="text-xl font-bold text-slate-700" data-content-key="headerTitle"></h1>
                    </div>
                    <div class="flex items-center">
                         <a href="#features" class="hidden sm:block text-sm font-semibold text-slate-600 hover:text-amber-500 transition-colors" data-content-key="navFeatures"></a>
                         <a href="https://github.com/MR-Amoori/Complete_installation_of_X-UI_panel" target="_blank" class="hidden sm:block text-sm font-semibold text-slate-600 hover:text-amber-500 transition-colors mx-4" data-content-key="navGithub"></a>
                        <button id="lang-toggle" class="p-2 rounded-md text-sm font-semibold text-slate-600 bg-slate-200 hover:bg-slate-300 transition-colors">
                            <span data-content-key="langToggle"></span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <!-- Hero Section -->
            <section class="text-center py-20 sm:py-24 lg:py-32 px-4 bg-white">
                <div class="container mx-auto">
                    <h2 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold text-slate-900" data-content-key="heroTitle"></h2>
                    <p class="mt-4 max-w-2xl mx-auto text-lg text-slate-600" data-content-key="heroSubtitle"></p>
                    <div class="mt-8 max-w-xl mx-auto">
                        <p class="text-sm font-semibold text-slate-500 mb-2" data-content-key="heroCommandPrompt"></p>
                        <div class="relative">
                            <div class="bg-slate-900 text-left p-4 rounded-lg font-mono text-slate-300 text-sm sm:text-base overflow-x-auto">
                                $<span id="install-command"></span>
                            </div>
                            <button id="copy-btn" class="absolute top-2 right-2 rtl:right-auto rtl:left-2 bg-slate-700 text-slate-300 hover:bg-slate-600 text-xs font-semibold py-1 px-2 rounded">
                                <span data-content-key="copyButton"></span>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Features Section -->
            <section id="features" class="py-16 sm:py-20 lg:py-24 px-4">
                <div class="container mx-auto text-center">
                    <h3 class="text-3xl font-bold text-slate-900" data-content-key="featuresTitle"></h3>
                    <p class="mt-3 max-w-xl mx-auto text-slate-600" data-content-key="featuresSubtitle"></p>
                    <div id="features-grid" class="mt-12 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 text-left">
                        <!-- Feature cards will be injected here -->
                    </div>
                </div>
            </section>

            <!-- Terminal Simulator Section -->
            <section class="py-16 sm:py-20 lg:py-24 px-4 bg-white">
                 <div class="container mx-auto text-center">
                    <h3 class="text-3xl font-bold text-slate-900" data-content-key="terminalTitle"></h3>
                    <p class="mt-3 max-w-xl mx-auto text-slate-600" data-content-key="terminalSubtitle"></p>
                    <div class="mt-12 max-w-4xl mx-auto bg-slate-900 rounded-lg shadow-2xl overflow-hidden">
                        <div class="bg-slate-800 h-8 flex items-center px-4 space-x-2">
                            <div class="w-3 h-3 bg-red-500 rounded-full"></div>
                            <div class="w-3 h-3 bg-yellow-400 rounded-full"></div>
                            <div class="w-3 h-3 bg-green-500 rounded-full"></div>
                            <div class="flex-grow text-center text-sm text-slate-400 font-mono" data-content-key="terminalWindowTitle"></div>
                        </div>
                        <div id="terminal-body" class="p-4 text-left font-mono text-sm h-80 overflow-y-auto text-white">
                           <div id="terminal-output"></div>
                           <div class="flex">
                               <span class="text-emerald-400">user@vps:~$</span>
                               <span id="terminal-input" class="flex-1 pl-2"></span>
                               <span class="terminal-cursor"></span>
                           </div>
                        </div>
                    </div>
                 </div>
            </section>

        </main>

        <footer class="text-center py-8 px-4 border-t border-slate-200">
            <p class="text-slate-600">
                <span data-content-key="footerText"></span>
                <a href="https://mramoori.ir" target="_blank" class="text-amber-600 hover:underline font-semibold">محمدرضا عموری</a>
            </p>
        </footer>
    </div>

    <script>
        const content = {
            en: {
                headerTitle: "X-UI Installer",
                navFeatures: "Features",
                navGithub: "GitHub",
                langToggle: "فارسی",
                heroTitle: "The Easiest Way to Install X-UI Panel",
                heroSubtitle: "A smart and complete script for installing and managing the X-UI panel. With just one command, install, update, and manage your panel effortlessly.",
                heroCommandPrompt: "Copy and run this command in your server's terminal:",
                installCommand: "bash <(curl -Ls https://raw.githubusercontent.com/Mr-Amoori/x-ui/main/install.sh)",
                copyButton: "Copy",
                copiedButton: "Copied!",
                featuresTitle: "Powerful Features",
                featuresSubtitle: "All the tools you need for comprehensive panel management, accessible through an interactive menu.",
                features: [
                    { id: 'install', icon: '🚀', name: 'Install', desc: 'A clean and standard installation of the latest version.' },
                    { id: 'update', icon: '🔄', name: 'Update', desc: 'Update the panel to the newest version with one click.' },
                    { id: 'uninstall', icon: '❌', name: 'Uninstall', desc: 'Completely remove the panel and its files.' },
                    { id: 'status', icon: '📊', name: 'Check Status', desc: 'View the current status of the panel service.' },
                    { id: 'logs', icon: '📄', name: 'Show Logs', desc: 'Display real-time logs for troubleshooting.' },
                    { id: 'enable', icon: '✅', name: 'Enable Service', desc: 'Enable the panel service to start on boot.' },
                    { id: 'disable', icon: '⛔️', name: 'Disable Service', desc: 'Disable the auto-start of the panel service.' },
                    { id: 'port', icon: '🔌', name: 'Change Port', desc: 'Easily change the login port for the panel.' },
                ],
                terminalTitle: "Live Terminal Simulator",
                terminalSubtitle: "Click on any feature card above to see how the command works in a simulated terminal environment.",
                terminalWindowTitle: "bash - x-ui-installer",
                footerText: "Script and Documentation by "
            },
            fa: {
                headerTitle: "نصب کننده X-UI",
                navFeatures: "قابلیت‌ها",
                navGithub: "گیت‌هاب",
                langToggle: "English",
                heroTitle: "ساده‌ترین راه برای نصب پنل X-UI",
                heroSubtitle: "یک اسکریپت هوشمند و کامل برای نصب و مدیریت پنل X-UI. تنها با یک دستور، پنل خود را به راحتی نصب، آپدیت و مدیریت کنید.",
                heroCommandPrompt: "این دستور را کپی و در ترمینال سرور خود اجرا کنید:",
                installCommand: "bash <(curl -Ls https://raw.githubusercontent.com/Mr-Amoori/x-ui/main/install.sh)",
                copyButton: "کپی",
                copiedButton: "کپی شد!",
                featuresTitle: "ویژگی‌های قدرتمند",
                featuresSubtitle: "تمام ابزارهای مورد نیاز شما برای مدیریت جامع پنل، که از طریق یک منوی تعاملی در دسترس است.",
                features: [
                    { id: 'install', icon: '🚀', name: 'نصب', desc: 'نصب تمیز و استاندارد آخرین نسخه پنل.' },
                    { id: 'update', icon: '🔄', name: 'بروزرسانی', desc: 'ارتقاء پنل به جدیدترین نسخه با یک کلیک.' },
                    { id: 'uninstall', icon: '❌', name: 'حذف', desc: 'حذف کامل پنل و فایل‌های مربوط به آن.' },
                    { id: 'status', icon: '📊', name: 'بررسی وضعیت', desc: 'مشاهده وضعیت فعلی سرویس پنل.' },
                    { id: 'logs', icon: '📄', name: 'نمایش لاگ‌ها', desc: 'نمایش لاگ‌های زنده برای عیب‌یابی.' },
                    { id: 'enable', icon: '✅', name: 'فعال‌سازی سرویس', desc: 'فعال کردن سرویس پنل برای اجرا در بوت.' },
                    { id: 'disable', icon: '⛔️', name: 'غیرفعال‌سازی سرویس', desc: 'غیرفعال کردن اجرای خودکار سرویس پنل.' },
                    { id: 'port', icon: '🔌', name: 'تغییر پورت', desc: 'تغییر پورت ورود به پنل به سادگی.' },
                ],
                terminalTitle: "شبیه‌ساز زنده ترمینال",
                terminalSubtitle: "روی هر یک از کارت‌های ویژگی در بالا کلیک کنید تا نحوه عملکرد دستور آن را در یک محیط ترمینال شبیه‌سازی شده ببینید.",
                terminalWindowTitle: "bash - x-ui-installer",
                footerText: "اسکریپت و مستندات توسط "
            }
        };

        const terminalOutputs = {
            en: {
                welcome: `Welcome to the X-UI Panel Installer Script!\nSelect an option from the menu by clicking a card above.\n`,
                install: `Executing: Install Panel\n[INFO] Downloading latest X-UI version...\n[INFO] Extracting files...\n[INFO] Setting up systemd service...\n[SUCCESS] X-UI panel installed successfully!\nAccess your panel at http://YOUR_IP:PORT`,
                update: `Executing: Update Panel\n[INFO] Checking for new version...\n[INFO] New version found! Downloading...\n[SUCCESS] Panel updated to the latest version. Please restart the service.`,
                uninstall: `Executing: Uninstall Panel\n[WARN] This will remove all X-UI data. Are you sure? (Simulated 'yes')\n[INFO] Stopping service...\n[INFO] Removing files...\n[SUCCESS] X-UI panel has been uninstalled.`,
                status: `Executing: Check Status\n● x-ui.service - X-UI Panel Service\n   Loaded: loaded (/etc/systemd/system/x-ui.service; enabled)\n   Active: active (running) since Mon 2024-10-21 15:03:21 UTC; 5s ago`,
                logs: `Executing: Show Logs\n-- Logs begin at Mon 2024-10-21 15:03:21 UTC. --\nINFO[2024-10-21 15:03:21] X-UI started\nINFO[2024-10-21 15:03:22] Web listen: 0.0.0.0:54321`,
                enable: `Executing: Enable Service\n[INFO] Created symlink /etc/systemd/system/multi-user.target.wants/x-ui.service → /etc/systemd/system/x-ui.service.\n[SUCCESS] X-UI service enabled. It will now start on boot.`,
                disable: `Executing: Disable Service\n[INFO] Removed /etc/systemd/system/multi-user.target.wants/x-ui.service.\n[SUCCESS] X-UI service disabled. It will no longer start on boot.`,
                port: `Executing: Change Port\n[INFO] Please enter the new port number (simulated '2053').\n[SUCCESS] Port changed to 2053. Please restart the panel.`
            },
            fa: {
                welcome: `به اسکریپت نصب پنل X-UI خوش آمدید!\nبا کلیک کردن روی یک کارت در بالا، گزینه‌ای را از منو انتخاب کنید.\n`,
                install: `در حال اجرا: نصب پنل\n[اطلاعات] در حال دانلود آخرین نسخه X-UI...\n[اطلاعات] در حال استخراج فایل‌ها...\n[اطلاعات] در حال راه‌اندازی سرویس systemd...\n[موفقیت] پنل X-UI با موفقیت نصب شد!\nبه پنل خود در آدرس http://YOUR_IP:PORT دسترسی پیدا کنید`,
                update: `در حال اجرا: بروزرسانی پنل\n[اطلاعات] در حال بررسی برای نسخه جدید...\n[اطلاعات] نسخه جدید یافت شد! در حال دانلود...\n[موفقیت] پنل به آخرین نسخه بروزرسانی شد. لطفاً سرویس را مجدداً راه‌اندازی کنید.`,
                uninstall: `در حال اجرا: حذف پنل\n[هشدار] این عمل تمام داده‌های X-UI را حذف می‌کند. آیا مطمئن هستید؟ (پاسخ 'بله' شبیه‌سازی شد)\n[اطلاعات] در حال متوقف کردن سرویس...\n[اطلاعات] در حال حذف فایل‌ها...\n[موفقیت] پنل X-UI حذف شد.`,
                status: `در حال اجرا: بررسی وضعیت\n● x-ui.service - سرویس پنل X-UI\n   Loaded: loaded (/etc/systemd/system/x-ui.service; enabled)\n   Active: active (running) since Mon 2024-10-21 15:03:21 UTC; 5s ago`,
                logs: `در حال اجرا: نمایش لاگ‌ها\n-- لاگ‌ها از تاریخ Mon 2024-10-21 15:03:21 UTC آغاز می‌شود. --\nINFO[2024-10-21 15:03:21] X-UI started\nINFO[2024-10-21 15:03:22] Web listen: 0.0.0.0:54321`,
                enable: `در حال اجرا: فعال‌سازی سرویس\n[اطلاعات] پیوند نمادین ایجاد شد /etc/systemd/system/multi-user.target.wants/x-ui.service → /etc/systemd/system/x-ui.service.\n[موفقیت] سرویس X-UI فعال شد. اکنون در هنگام بوت شدن اجرا می‌شود.`,
                disable: `در حال اجرا: غیرفعال‌سازی سرویس\n[اطلاعات] حذف شد /etc/systemd/system/multi-user.target.wants/x-ui.service.\n[موفقیت] سرویس X-UI غیرفعال شد. دیگر در هنگام بوت شدن اجرا نخواهد شد.`,
                port: `در حال اجرا: تغییر پورت\n[اطلاعات] لطفاً شماره پورت جدید را وارد کنید (مقدار '2053' شبیه‌سازی شد).\n[موفقیت] پورت به 2053 تغییر یافت. لطفاً پنل را مجدداً راه‌اندازی کنید.`
            }
        };

        const appContainer = document.getElementById('app-container');
        let currentLang = 'fa';
        let isTyping = false;

        function updateContent() {
            const langContent = content[currentLang];
            document.documentElement.lang = currentLang;
            appContainer.className = currentLang === 'fa' ? 'rtl' : '';
            
            document.querySelectorAll('[data-content-key]').forEach(el => {
                const key = el.getAttribute('data-content-key');
                let value = langContent;
                key.split('.').forEach(k => { value = value ? value[k] : ''; });
                if(el.id === 'install-command'){
                   el.textContent = content.en.installCommand; // Always show command in English
                } else {
                   el.textContent = value;
                }
            });

            const featuresGrid = document.getElementById('features-grid');
            featuresGrid.innerHTML = langContent.features.map(feature => `
                <div class="feature-card bg-white p-6 rounded-lg shadow-md hover:shadow-xl hover:-translate-y-1 transition-all cursor-pointer" data-feature-id="${feature.id}">
                    <div class="text-3xl">${feature.icon}</div>
                    <h4 class="mt-4 font-bold text-lg text-slate-900">${feature.name}</h4>
                    <p class="mt-1 text-sm text-slate-600">${feature.desc}</p>
                </div>
            `).join('');
            
            typeInTerminal(terminalOutputs[currentLang].welcome, document.getElementById('terminal-output'), 20);
        }

        function typeInTerminal(text, element, speed) {
            if (isTyping) return;
            isTyping = true;
            element.innerHTML = ''; 
            const lines = text.split('\n');
            let lineIndex = 0;
            let charIndex = 0;
            
            function typeChar() {
                if (lineIndex < lines.length) {
                    if (charIndex < lines[lineIndex].length) {
                        element.innerHTML += lines[lineIndex].charAt(charIndex);
                        charIndex++;
                        setTimeout(typeChar, speed);
                    } else {
                        element.innerHTML += '\n';
                        lineIndex++;
                        charIndex = 0;
                        setTimeout(typeChar, speed);
                    }
                } else {
                    isTyping = false;
                }
            }
            typeChar();
        }

        document.getElementById('lang-toggle').addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'fa' : 'en';
            updateContent();
        });
        
        document.getElementById('copy-btn').addEventListener('click', (e) => {
            const command = content.en.installCommand;
            navigator.clipboard.writeText(command).then(() => {
                const btn = e.currentTarget;
                const originalText = content[currentLang].copyButton;
                btn.textContent = content[currentLang].copiedButton;
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        });

        document.getElementById('features-grid').addEventListener('click', e => {
            const card = e.target.closest('.feature-card');
            if (card && !isTyping) {
                const featureId = card.dataset.featureId;
                const outputText = terminalOutputs[currentLang][featureId];
                if (outputText) {
                   typeInTerminal(outputText, document.getElementById('terminal-output'), 20);
                }
            }
        });

        updateContent();
    </script>
</body>
</html>
