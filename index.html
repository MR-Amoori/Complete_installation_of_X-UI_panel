            --color-terminal-bg: #010409;
        }
        html { scroll-behavior: smooth; }
        body { background-color: #0d1117; color: #c9d1d9; }
        .bg-pattern { background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.04) 1px, transparent 0); background-size: 30px 30px; }
        .font-fa { font-family: var(--font-fa); }
        .font-en { font-family: var(--font-en); }
        .glass-card { background: rgba(22, 27, 34, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); transition: transform 0.3s ease, box-shadow 0.3s ease; }

        .fade-in-up { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease-out, transform 0.6s ease-out; }
        .fade-in-up.visible { opacity: 1; transform: translateY(0); }
        .nav-link { position: relative; transition: color 0.3s; }
        .nav-link.active, .nav-link:hover { color: var(--color-primary); }
        .nav-link::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -5px; left: 50%; transform: translateX(-50%); background: var(--color-primary); transition: width .3s; }
        .nav-link.active::after { width: 60%; }
        details summary::-webkit-details-marker { display: none; }
        .blinking-cursor { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

            tutorialStep: (icon, step, titleKey, descKey, command, t) => `<div class="glass-card p-6 rounded-xl flex flex-col md:flex-row items-center gap-6 fade-in-up"><div class="flex-shrink-0"><div class="w-24 h-24 bg-gray-900 rounded-full flex flex-col items-center justify-center border-2 border-[var(--color-primary)]"><i class="ph-${icon} text-3xl text-[var(--color-primary)]"></i><span class="font-bold mt-1">${step}</span></div></div><div class="text-center md:text-inherit flex-1"><h3 class="text-2xl font-bold">${t[titleKey]}</h3><p class="text-gray-400 mt-2 mb-4">${t[descKey]}</p>${command?`<div class="relative bg-black rounded-lg p-4 text-left mt-2"><code class="font-mono text-gray-300 text-sm break-words">${command}</code><button class="copy-btn" title="${t['copy-success']}"><i class="ph-copy text-xl"></i></button></div>`:''}</div></div>`,
            commandCard: (icon, titleKey, descKey, command, t) => `<div class="glass-card p-6 rounded-xl fade-in-up"><div class="flex items-center mb-3"><i class="ph-${icon} text-3xl text-[var(--color-primary)] ${currentLang==='fa'?'ml-3':'mr-3'}"></i><h3 class="text-2xl font-bold">${t[titleKey]}</h3></div><p class="text-gray-400 mb-4">${t[descKey]}</p><div class="relative bg-black rounded-lg p-4 text-left"><code class="font-mono text-gray-300 text-sm break-words">${command}</code><button class="copy-btn" title="${t['copy-success']}"><i class="ph-copy text-xl"></i></button></div></div>`,
            faqItem: (qKey, aKey, t) => `<details class="glass-card p-5 rounded-lg cursor-pointer group fade-in-up"><summary class="font-semibold text-lg flex justify-between items-center">${t[qKey]}<i class="ph-caret-down text-xl transition-transform group-open:rotate-180"></i></summary><p class="text-gray-400 mt-4 pt-4 border-t border-gray-700 text-sm leading-relaxed">${t[aKey]}</p></details>`
        };
        
        function setLanguage(lang) {
            if (lang === currentLang) return;
            currentLang = lang;
            const t = translations[currentLang];

            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
            document.body.classList.toggle('font-fa', lang === 'fa');
            document.body.classList.toggle('font-en', lang === 'en');
            ui.langFaBtn.classList.toggle('bg-[var(--color-primary)]', lang === 'fa');
            ui.langEnBtn.classList.toggle('bg-[var(--color-primary)]', lang === 'en');

            document.querySelectorAll('[data-translate]').forEach(el => {
                if(t[el.dataset.translate]) el.innerHTML = t[el.dataset.translate];
            });
            
            ui.featuresGrid.innerHTML = [
                templates.card('plugs', 'feature1-title', 'feature1-desc', t),
                templates.card('gauge', 'feature2-title', 'feature2-desc', t, 'lg:!mt-8'),
                templates.card('chart-bar', 'feature3-title', 'feature3-desc', t),
                templates.card('gear-six', 'feature4-title', 'feature4-desc', t, 'lg:!mt-8')
            ].join('');

            const stepText = currentLang === 'fa' ? 'قدم' : 'Step';
            ui.tutorialContainer.innerHTML = [
                templates.tutorialStep('server', `${stepText} 1`, 'step1-title', 'step1-desc', null, t),
                templates.tutorialStep('ssh', `${stepText} 2`, 'step2-title', 'step2-desc', 'ssh root@YOUR_SERVER_IP', t),
                templates.tutorialStep('scroll', `${stepText} 3`, 'step3-title', 'step3-desc', 'bash &lt;(curl -Ls ...)', t),
                templates.tutorialStep('key', `${stepText} 4`, 'step4-title', 'step4-desc', null, t)
            ].join('');

            const usageStepNumbers = lang === 'fa' ? ['۱', '۲', '۳', '۴'] : ['1', '2', '3', '4'];
            ui.usageGuideContainer.innerHTML = [
                 templates.tutorialStep('terminal', usageStepNumbers[0], 'usage1-title', 'usage1-desc', 'x-ui', t),
                 templates.tutorialStep('user-gear', usageStepNumbers[1], 'usage2-title', 'usage2-desc', null, t),
                 templates.tutorialStep('info', usageStepNumbers[2], 'usage3-title', 'usage3-desc', null, t),
                 templates.tutorialStep('database', usageStepNumbers[3], 'usage4-title', 'usage4-desc', null, t)
            ].join('');

            ui.commandsGrid.innerHTML = [
                templates.commandCard('download-simple', 'install-title', 'install-desc', 'bash &lt;(curl -Ls ...)', t),
                templates.commandCard('list-checks', 'manage-title', 'manage-desc', 'x-ui', t),
                templates.commandCard('terminal', 'logs-title', 'logs-desc', 'x-ui logs', t),
                templates.commandCard('arrow-clockwise', 'restart-title', 'restart-desc', 'x-ui restart', t)
            ].join('');
            
            ui.securityGrid.innerHTML = [
                templates.card('key', 'sec1-title', 'sec1-desc', t),
                templates.card('fire', 'sec2-title', 'sec2-desc', t),
                templates.card('cloud-arrow-up', 'sec3-title', 'sec3-desc', t)
            ].join('');

            ui.faqContainer.innerHTML = [
                templates.faqItem('faq1-q', 'faq1-a', t),
                templates.faqItem('faq2-q', 'faq2-a', t),
                templates.faqItem('faq3-q', 'faq3-a', t)
            ].join('');
            
            const footerLinkText = currentLang === 'fa' ? 'محمدرضا عموری' : 'Mohammadreza Amoori';
            ui.footerText.innerHTML = `${t["footer-text"]} <a href="https://github.com/MR-Amoori" target="_blank" class="font-semibold text-[var(--color-primary)] hover:underline">${footerLinkText}</a>`;
            
            runTerminalSimulation(true);
        }

        function handleCopyClick(e) {
            const copyBtn = e.target.closest('.copy-btn');
            if (!copyBtn) return;
            const commandText = copyBtn.closest('.relative').querySelector('code').textContent.trim().replace('...', 'https://raw.githubusercontent.com/MR-Amoori/Complete_installation_of_X-UI_panel/master/install.sh');
            navigator.clipboard.writeText(commandText).then(() => showToast(translations[currentLang]['copy-success'], 'success')).catch(() => showToast(translations[currentLang]['copy-error'], 'error'));
        }

        function runTerminalSimulation(isHero = false) {
            const termOutput = isHero ? ui.heroTerminalOutput : ui.terminalOutput;
            const logs = translations[currentLang][isHero ? 'hero-sim-logs' : 'sim-logs'];
            const button = isHero ? null : ui.runSimBtn;

            if (isHero) {
                clearTimeout(heroSimTimeout);
            } else {
                 if (isSimRunning) return;
                isSimRunning = true;
                button.disabled = true;
                button.classList.add('opacity-50', 'cursor-not-allowed');
            }
           
            termOutput.innerHTML = '';
            let i = 0;

            function typeLine() {
                if (i >= logs.length) {
                    if(!isHero) {
                        termOutput.innerHTML += '<span class="blinking-cursor">_</span>';
                        isSimRunning = false;
                        button.disabled = false;
                        button.classList.remove('opacity-50', 'cursor-not-allowed');
                    } else {
                         heroSimTimeout = setTimeout(() => runTerminalSimulation(true), 5000);
                    }
                    return;
                }
                const logText = logs[i];
                const line = document.createElement('div');
                let colorClass = 'text-gray-300';
                if (logText.startsWith('$')) colorClass = 'text-gray-400';
                if (logText.startsWith('[OK]')) colorClass = 'text-green-400';
                if (logText.startsWith('[SUCCESS]')) colorClass = 'text-green-300 font-bold';
                if (logText.startsWith('[INFO]') && logs.indexOf(logText) > logs.length - 3) colorClass = 'text-cyan-400';
                line.className = `whitespace-pre-wrap ${colorClass}`;
                line.textContent = logText;
                termOutput.appendChild(line);
                termOutput.scrollTop = termOutput.scrollHeight;
                i++;
                const timeout = isHero ? 1200 : (Math.random() * 200 + 100);
                setTimeout(typeLine, timeout);
            }
            typeLine();
        }

        function showToast(message, type) {
            ui.toastMessage.textContent = message;
            ui.toast.className = `fixed bottom-5 right-5 text-white py-3 px-5 rounded-lg shadow-lg transition-all duration-300 transform translate-x-0 ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`;
            setTimeout(() => ui.toast.classList.add('translate-x-[calc(100%+20px)]'), 3000);
        }
        
        const animationObserver = new IntersectionObserver((entries) => entries.forEach(entry => {
            if(entry.isIntersecting) {
                entry.target.classList.add('visible');
                animationObserver.unobserve(entry.target);
            }
        }), { threshold: 0.1 });

        const navObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && entry.intersectionRatio > 0.5) {
                    const navLink = ui.navMenu.querySelector(`[data-nav-id=${entry.target.id}]`);
                    if (navLink) {
                        document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
                        navLink.classList.add('active');
                    }
                }
            });
        }, { rootMargin: '-50% 0px -50% 0px', threshold: 0 });

        function init() {
             Object.assign(ui, {
                langFaBtn: document.getElementById('lang-fa'),
                langEnBtn: document.getElementById('lang-en'),
                navMenu: document.getElementById('nav-menu'),
                toast: document.getElementById('toast'),
                toastMessage: document.getElementById('toast-message'),
                featuresGrid: document.querySelector('#features .grid'),
                tutorialContainer: document.querySelector('#tutorial .space-y-8'),
                usageGuideContainer: document.querySelector('#usage-guide .space-y-8'),
                commandsGrid: document.querySelector('#commands .grid'),
                securityGrid: document.querySelector('#security .grid'),
                faqContainer: document.querySelector('#faq .space-y-4'),
                footerText: document.getElementById('footer-text'),
                allSections: document.querySelectorAll('main > section'),
                terminalOutput: document.getElementById('terminal-output'),
                heroTerminalOutput: document.getElementById('hero-terminal-output'),
                runSimBtn: document.getElementById('run-simulation-btn')
            });

            ui.langFaBtn.addEventListener('click', () => setLanguage('fa'));
            ui.langEnBtn.addEventListener('click', () => setLanguage('en'));
            document.body.addEventListener('click', handleCopyClick);
            ui.runSimBtn.addEventListener('click', () => runTerminalSimulation(false));
            
            setLanguage('fa');
            
            document.querySelectorAll('.section-title').forEach(h => h.classList.add('text-3xl', 'font-bold', 'text-center', 'mb-12', 'fade-in-up'));
            document.querySelectorAll('.fade-in-up').forEach(el => animationObserver.observe(el));
            ui.allSections.forEach(section => {
                if(section) navObserver.observe(section);
            });
        }
        
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
